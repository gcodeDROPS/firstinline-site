<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FirstInLine — Live job search</title>
<meta name="description" content="Search live openings across 80+ companies that post first. No reposting, no noise.">
<style>

  :root {
    --bg: #090d16; --bg2: #0b1120; --card: #111827; --border: #1e293b;
    --primary: #3b82f6; --glow: rgba(59,130,246,.25); --accent: #10b981;
    --text: #f8fafc; --muted: #94a3b8; --gold: #f59e0b; --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: var(--primary); text-decoration: none; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

  nav { position: sticky; top: 0; z-index: 50; background: rgba(9,13,22,.86); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .nav-inner { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; max-width: 1100px; margin: 0 auto; }
  .logo { font-weight: 800; font-size: 1.22rem; letter-spacing: -.5px; }
  .logo span { color: var(--primary); }
  .nav-links { display: flex; align-items: center; gap: 22px; }
  .nav-links a { color: var(--muted); font-size: .92rem; }
  .nav-links a:hover { color: var(--text); }

  .hero { padding: 76px 24px 56px; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; top: -220px; left: 50%; transform: translateX(-50%); width: 900px; height: 520px; background: radial-gradient(ellipse, rgba(59,130,246,.18), transparent 60%); pointer-events: none; }
  .badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(59,130,246,.12); border: 1px solid rgba(59,130,246,.35); color: var(--primary); padding: 6px 16px; border-radius: 999px; font-size: .8rem; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; margin-bottom: 26px; }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  h1 { font-size: clamp(2.3rem, 5.5vw, 3.6rem); font-weight: 800; letter-spacing: -1.5px; line-height: 1.12; }
  h1 .grad { background: linear-gradient(90deg, #3b82f6, #10b981); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--muted); font-size: 1.16rem; max-width: 640px; margin: 20px auto 30px; }
  .cta-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 13px 28px; border-radius: 10px; font-weight: 700; font-size: 1rem; transition: all .15s; cursor: pointer; border: none; }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 24px var(--glow); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 36px var(--glow); }
  .btn-ghost { border: 1px solid var(--border); color: var(--text); background: transparent; }
  .btn-ghost:hover { border-color: var(--muted); }
  .btn-sm { padding: 8px 14px; font-size: .85rem; }
  .hero-note { color: var(--muted); font-size: .82rem; margin-top: 14px; }

  .live-stats { max-width: 760px; margin: 44px auto 0; display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 14px; }
  .hero-mini { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .hero-mini b { display: block; font-size: 1.7rem; font-weight: 800; color: var(--primary); }
  .hero-mini span { color: var(--muted); font-size: .82rem; }

  section { padding: 72px 24px; }
  .sec-label { color: var(--primary); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; text-align: center; margin-bottom: 12px; }
  h2 { text-align: center; font-size: clamp(1.7rem, 3.2vw, 2.3rem); font-weight: 800; letter-spacing: -.8px; margin-bottom: 16px; }
  .sec-sub { text-align: center; color: var(--muted); max-width: 620px; margin: 0 auto 44px; font-size: 1.05rem; }

  .problem-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
  .prob { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  .prob .x { color: var(--red); font-weight: 800; font-size: 1.1rem; }
  .prob h3 { font-size: 1rem; margin: 8px 0 6px; }
  .prob p { color: var(--muted); font-size: .9rem; }

  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .step { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 30px; }
  .step-num { width: 38px; height: 38px; border-radius: 10px; background: rgba(59,130,246,.15); color: var(--primary); font-weight: 800; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 1.05rem; }
  .step h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .step p { color: var(--muted); font-size: .95rem; }

  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
  .feat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 26px; transition: border-color .15s; }
  .feat:hover { border-color: rgba(59,130,246,.5); }
  .feat h3 { font-size: 1.05rem; margin-bottom: 8px; }
  .feat p { color: var(--muted); font-size: .93rem; }

  .app { background: var(--bg2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .app-head h2 { text-align: center; }
  .app-sub { text-align: center; color: var(--muted); margin-bottom: 20px; }
  .app-notice { background: rgba(59,130,246,.08); border: 1px dashed rgba(59,130,246,.4); color: var(--muted); padding: 12px 16px; border-radius: 10px; font-size: .85rem; margin-bottom: 20px; }
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; text-align: center; }
  .stat-card b { display: block; font-size: 1.7rem; font-weight: 800; }
  .stat-card span { color: var(--muted); font-size: .8rem; }
  .stat-card .s-new { color: var(--primary); } .stat-card .s-applied { color: var(--gold); } .stat-card .s-replied { color: var(--accent); } .stat-card .s-interview { color: #a78bfa; } .stat-card .s-offer { color: var(--accent); }
  .app-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
  .app-controls .search { flex: 1; min-width: 200px; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-size: .92rem; }
  .app-controls .search:focus { outline: none; border-color: var(--primary); }
  .chip { background: var(--bg); border: 1px solid var(--border); color: var(--muted); padding: 9px 14px; border-radius: 999px; font-size: .85rem; cursor: pointer; }
  .chip.active { border-color: var(--primary); color: var(--primary); font-weight: 600; }
  .role-controls { margin-top: 8px; gap: 6px; align-items: center; }
  .role-label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .role-chip { padding: 6px 12px; font-size: .78rem; }
  .sort-controls { margin-bottom: 8px; }
  .sort-select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: .85rem; cursor: pointer; }
  .sort-select:focus { outline: none; border-color: var(--primary); }
  .role-badge { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px; font-size: .68rem; font-weight: 700; border: 1px solid; vertical-align: middle; }
  .lead { display: flex; align-items: flex-start; gap: 16px; padding: 18px; border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; background: var(--card); transition: border-color .15s; }
  .lead:hover { border-color: rgba(59,130,246,.45); }
  .lead .score { min-width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; flex-shrink: 0; }
  .score.hi { background: rgba(16,185,129,.15); color: var(--accent); }
  .score.mid { background: rgba(245,158,11,.15); color: var(--gold); }
  .score.low { background: rgba(148,163,184,.13); color: var(--muted); }
  .lead .info { flex: 1; min-width: 0; }
  .co-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lead .info b { font-size: 1rem; }
  .lead .info .role { font-size: .86rem; color: var(--text); opacity: .8; margin-top: 1px; }
  .lead .info .why { font-size: .82rem; color: var(--muted); margin-top: 4px; }
  .lead .info .details { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .dchip { font-size: .72rem; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .dchip b { color: var(--text); font-weight: 600; }
  .tag { font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .tag.gh { background: rgba(59,130,246,.15); color: var(--primary); }
  .tag.ash { background: rgba(139,92,246,.15); color: #a78bfa; }
  .tag.li { background: rgba(14,165,233,.15); color: #38bdf8; }
  .tag.md { background: rgba(148,163,184,.15); color: var(--muted); }
  .stat-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; padding: 3px 9px; border-radius: 6px; font-weight: 700; }
  .st.new { background: rgba(59,130,246,.15); color: var(--primary); }
  .st.applied { background: rgba(245,158,11,.15); color: var(--gold); }
  .st.replied { background: rgba(16,185,129,.15); color: var(--accent); }
  .st.interview { background: rgba(167,139,250,.15); color: #a78bfa; }
  .st-offer { background: rgba(16,185,129,.25); color: var(--accent); }
  .lead-meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
  .note { margin-top: 8px; font-size: .8rem; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-style: italic; }
  .lead .actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; flex-shrink: 0; }
  .lead-links { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .lead-links a, .lead-links button { font-size: .72rem; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer; }
  .lead-links a:hover, .lead-links button:hover { border-color: var(--primary); color: var(--text); }
  .st-actions { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .st-actions button { font-size: .72rem; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer; }
  .st-actions button.on { border-color: var(--accent); color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .tool-search { display: flex; gap: 10px; max-width: 640px; margin: 0 auto 14px; }
  .tool-search .search { flex: 1; }
  .tool-options { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 18px; align-items: center; }
  .tool-chip { padding: 7px 13px; }
  .tool-stats { display: flex; gap: 14px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  .tool-stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 20px; text-align: center; }
  .tool-stat b { display: block; font-size: 1.3rem; color: var(--primary); }
  .tool-stat span { font-size: .75rem; color: var(--muted); }
  .tool-company { font-size: .72rem; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; display: inline-block; margin-bottom: 6px; }
  .tlead { display: flex; align-items: flex-start; gap: 14px; padding: 16px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; background: var(--card); }
  .tlead .info { flex: 1; min-width: 0; }
  .tlead .info b { font-size: .98rem; }
  .tlead .info .role { font-size: .85rem; color: var(--text); opacity: .8; }
  .tlead .info .meta { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  .tlead a { font-size: .78rem; }

  .case { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .case-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 26px; }
  .case-card .badge2 { display: inline-block; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 3px 10px; border-radius: 6px; margin-bottom: 12px; }
  .case-card .b-green { background: rgba(16,185,129,.15); color: var(--accent); }
  .case-card .b-blue { background: rgba(59,130,246,.15); color: var(--primary); }
  .case-card .b-gold { background: rgba(245,158,11,.15); color: var(--gold); }
  .case-card h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .case-card p { color: var(--muted); font-size: .92rem; }
  .case-card .move { margin-top: 12px; font-size: .85rem; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .case-card .move b { color: var(--accent); }

  .pricing { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 760px; margin: 0 auto; }
  .plan { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 32px; }
  .plan.pop { border-color: var(--primary); box-shadow: 0 0 50px var(--glow); position: relative; }
  .plan.pop .tag { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #fff; font-size: .72rem; font-weight: 700; padding: 5px 16px; border-radius: 999px; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; }
  .plan h3 { font-size: 1.1rem; }
  .plan .price { font-size: 2.4rem; font-weight: 800; margin: 12px 0 4px; }
  .plan .price small { font-size: .9rem; color: var(--muted); font-weight: 400; }
  .plan .perk { color: var(--muted); font-size: .85rem; margin-bottom: 18px; }
  .plan ul { list-style: none; margin: 0 0 24px; }
  .plan li { color: var(--muted); font-size: .93rem; padding: 7px 0; border-bottom: 1px solid rgba(30,41,59,.6); }
  .plan li:last-child { border-bottom: none; }
  .plan li b { color: var(--text); }
  .plan .btn { width: 100%; text-align: center; display: block; }

  .faq { max-width: 720px; margin: 0 auto; }
  details { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; margin-bottom: 12px; }
  summary { cursor: pointer; font-weight: 600; font-size: 1rem; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  summary::after { content: '+'; color: var(--primary); font-size: 1.3rem; font-weight: 700; }
  details[open] summary::after { content: '−'; }
  details p { color: var(--muted); font-size: .93rem; margin-top: 10px; }

  .cta-box { text-align: center; background: linear-gradient(180deg, rgba(59,130,246,.1), transparent); border: 1px solid var(--border); border-radius: 20px; padding: 60px 32px; max-width: 780px; margin: 0 auto; }
  .cta-box h2 { margin-bottom: 12px; }
  .cta-box p { color: var(--muted); margin-bottom: 26px; }

  footer { border-top: 1px solid var(--border); padding: 34px 24px; text-align: center; color: var(--muted); font-size: .85rem; }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--text); }
  footer .f-links { display: flex; gap: 20px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(90px); background: var(--primary); color: #fff; padding: 12px 24px; border-radius: 10px; font-weight: 600; font-size: .9rem; box-shadow: 0 8px 30px rgba(0,0,0,.4); transition: transform .3s; z-index: 99; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    .nav-links a:not(.nav-cta) { display: none; }
    .lead { flex-wrap: wrap; }
    .lead .actions { width: 100%; align-items: flex-start; }
  }

  .tool-hero { padding: 64px 24px 40px; text-align: center; }
  .tool-hero h1 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); font-weight: 800; letter-spacing: -1px; }
  .tool-hero p { color: var(--muted); max-width: 560px; margin: 14px auto 26px; }
  .tool-search { display: flex; gap: 10px; max-width: 640px; margin: 0 auto 14px; }
  .tool-options { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; align-items: center; }
  .tool-stats { display: flex; gap: 14px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .tool-stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 20px; text-align: center; }
  .tool-stat b { display: block; font-size: 1.3rem; color: var(--primary); }
  .tool-stat span { font-size: .75rem; color: var(--muted); }
  .results-wrap { max-width: 860px; margin: 0 auto; padding: 0 24px 60px; }
  .tlead { display: flex; align-items: flex-start; gap: 14px; padding: 16px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; background: var(--card); }
  .tlead .info { flex: 1; min-width: 0; }
  .tlead .info b { font-size: .98rem; }
  .tlead .info .role { font-size: .85rem; color: var(--text); opacity: .8; }
  .tlead .info .meta { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  .tlead a { font-size: .78rem; }
  .tool-nav { position: sticky; top: 0; z-index: 50; background: rgba(9,13,22,.86); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .tool-nav-inner { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; max-width: 1100px; margin: 0 auto; }
  .logo { font-weight: 800; font-size: 1.1rem; }
  .tool-nav-inner a { color: var(--muted); font-size: .88rem; }
</style>
</head>
<body>
<nav class="tool-nav">
  <div class="tool-nav-inner">
    <div class="logo">First<span>InLine</span></div>
    <a href="/">← Back to home</a>
  </div>
</nav>

<div class="tool-hero">
  <h1>See what the day brings</h1>
  <p>Type a role, a city, or both. FirstInLine pulls live openings straight from the companies that post them first — no reposting, no noise.</p>
  <div class="tool-search">
    <input class="search" id="toolQ" type="text" placeholder="e.g. SDR in Atlanta  or  remote BDR  or  Account Executive">
    <button class="btn btn-primary" id="toolGo" type="button">Search</button>
  </div>
  <div class="tool-options">
    <span class="role-label">Role:</span>
    <button class="chip tool-chip active" data-tool="all">All</button>
    <button class="chip tool-chip" data-tool="sdr">SDR</button>
    <button class="chip tool-chip" data-tool="bdr">BDR</button>
    <button class="chip tool-chip" data-tool="inside">Inside</button>
    <button class="chip tool-chip" data-tool="ae">AE</button>
  </div>
  <div class="tool-stats" id="toolStats"></div>
</div>

<div class="results-wrap">
  <div id="toolResults"><div class="empty" style="display:none;" id="toolEmpty">No live openings match. Try a different role or location.</div></div>
</div>

<script>

const TOOL_BOARDS = [

  ["gh","figma"],["gh","twilio"],["gh","asana"],["gh","rubrik"],["gh","vercel"],["gh","onetrust"],

  ["ashby","openai"],["ashby","harvey"],["ashby","clera"],["ashby","decagon"],["ashby","ramp"],
  ["ashby","notion"],["ashby","plaid"],["ashby","vanta"],["ashby","dandy"],["ashby","baseten"],
  ["ashby","pragmatike"],["ashby","temporal"],["ashby","drata"],["ashby","metaview"],["ashby","linear"],
  ["ashby","netic"],["ashby","roboflow"],["ashby","tremendous"],["ashby","numeric"],["ashby","doppel"],
  ["ashby","arena"],["ashby","laurel"],["ashby","outset"],["ashby","arketa"],["ashby","camber"],
  ["ashby","furtherai"],["ashby","glimpse"],["ashby","raindrop"],["ashby","automat"],["ashby","ycombinator"],
  ["ashby","ajax"],["ashby","popl"],["ashby","runway"],["ashby","aibidia"],["ashby","rubie"],
  ["ashby","30mpc"],["ashby","conduit"],["ashby","hubstaff"],
  ["lever","ajax"],["lever","lendbuzz"],["lever","linkedin"],["lever","sysdig"],["lever","finquery"],
  ["lever","twodots"],
];
const TOOL_CACHE = {};

function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function toolFetch(kind, slug){
  const key = kind+'/'+slug;
  if(TOOL_CACHE[key]) return TOOL_CACHE[key];
  let url;
  if(kind==='gh') url='https://boards-api.greenhouse.io/v1/boards/'+slug+'/jobs';
  else if(kind==='ashby') url='https://api.ashbyhq.com/posting-api/job-board/'+slug;
  else url='https://api.lever.co/v0/postings/'+slug+'?mode=json';
  try{
    const r = await fetch(url);
    if(!r.ok) return [];
    const d = await r.json();
    let jobs = [];
    if(kind==='gh') jobs = d.jobs||[];
    else if(kind==='ashby') jobs = d.jobs||[];
    else jobs = d||[];
    const norm = jobs.map(j=>({
      company: j.company ? (j.company.name||slug) : slug,
      title: j.title||j.name||'',
      loc: (j.location&&(j.location.name||j.location))||'',
      url: j.absolute_url||j.jobUrl||j.applyUrl||j.hostedUrl||'',
      date: j.updated_at||j.published_at||j.first_published_at||'',
    }));
    TOOL_CACHE[key]=norm;
    return norm;
  }catch(e){ return []; }
}

function toolMatch(job, q, role){
  const hay = (job.title+' '+job.location+' '+job.company).toLowerCase();
  if(role!=='all' && !hay.includes(role)) return false;
  if(!q) return true;
  const words = q.toLowerCase().split(/\\s+/).filter(w=>w.length>1 && !['in','at','the','for','a','an'].includes(w));
  return words.every(w=>hay.includes(w));
}
function toolRole(job){
  const t=job.title.toLowerCase();
  if(t.includes('sales development')||t.indexOf('sdr')>=0) return 'sdr';
  if(t.includes('business development')||t.indexOf('bdr')>=0) return 'bdr';
  if(t.includes('inside sales')) return 'inside';
  if(t.includes('account executive')||t.indexOf('ae')>=0) return 'ae';
  return '';
}
async function toolRun(){
  const q = document.getElementById('toolQ').value.trim();
  const active = document.querySelector('.tool-chip.active');
  const role = active?active.dataset.tool:'all';
  const el = document.getElementById('toolResults');
  const stats = document.getElementById('toolStats');
  el.innerHTML = '<div class="empty">Searching 80+ live boards…</div>';
  const all=[];
  for(const [kind,slug] of TOOL_BOARDS){
    const jobs = await toolFetch(kind,slug);
    for(const j of jobs){
      const r = toolRole(j);
      if(role!=='all' && r!==role) continue;
      if(!toolMatch(j,q,'all')) continue;
      all.push({...j, roleTag:r});
    }
  }
  all.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const seen={}; const uniq=[];
  for(const j of all){ const k=(j.title+'|'+j.company).toLowerCase(); if(!seen[k]){seen[k]=1;uniq.push(j);} }
  stats.innerHTML =
    `<div class="tool-stat"><b>${uniq.length}</b><span>live matches</span></div>`+
    `<div class="tool-stat"><b>${TOOL_BOARDS.length}</b><span>boards checked</span></div>`;
  if(!uniq.length){ el.innerHTML='<div class="empty">No live openings match. Try a different role or location.</div>'; return; }
  el.innerHTML = uniq.slice(0,60).map(j=>{
    const loc = j.location?esc(j.location):'';
    const date = j.date?esc(j.date.slice(0,10)):'';
    const badge = j.roleTag?`<span class="role-badge" style="background:#22d3ee22;color:#22d3ee;border-color:#22d3ee55">${j.roleTag.toUpperCase()}</span>`:'';
    return `<div class="tlead">
      <div class="info">
        <b>${esc(j.company)}</b> ${badge}
        <div class="role">${esc(j.title)}</div>
        <div class="meta">${loc}${date?' · '+date:''}</div>
      </div>
      ${j.url?`<a href="${esc(j.url)}" target="_blank" rel="noopener">View →</a>`:''}
    </div>`;
  }).join('');
}
document.querySelectorAll('.tool-chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.tool-chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active'); toolRun();
}));
document.getElementById('toolGo').addEventListener('click',toolRun);
document.getElementById('toolQ').addEventListener('keydown',e=>{ if(e.key==='Enter') toolRun(); });
toolRun();

</script>
</body>
